<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #919191;
      overflow: hidden;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    canvas { display: block; }

    #tooltip {
      position: fixed;
      top: 0; left: 0;
      padding: 6px 14px;
      background: rgba(8, 8, 8, 0.70);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border-radius: 3px;
      pointer-events: none;
      opacity: 0;
      transform: translate(18px, -50%);
      transition: opacity 0.15s ease;
      white-space: nowrap;
    }

    #hint {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.35);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
    }

    #brand {
      position: fixed;
      top: 28px; left: 36px;
      color: rgba(255, 255, 255, 0.50);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      user-select: none;
    }

    #counter {
      position: fixed;
      top: 28px; right: 36px;
      color: rgba(255, 255, 255, 0.32);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      user-select: none;
    }
  </style>
</head>
<body>

  <div id="brand">Portfolio</div>
  <div id="counter">6 Projects</div>
  <div id="tooltip"></div>
  <div id="hint">Drag to rotate &nbsp;·&nbsp; Click to open</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
  /* ================================================================
     SCENE
  ================================================================ */
  const tooltip = document.getElementById('tooltip');

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x919191);

  const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
  camera.position.set(0, 0.2, 7.2);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
  renderer.outputEncoding    = THREE.sRGBEncoding;
  renderer.toneMapping       = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  document.body.appendChild(renderer.domElement);

  /* ================================================================
     CONTROLS
  ================================================================ */
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping   = true;
  controls.dampingFactor   = 0.055;
  controls.enableZoom      = false;
  controls.enablePan       = false;
  controls.rotateSpeed     = 0.65;
  controls.autoRotate      = true;
  controls.autoRotateSpeed = 0.38;
  controls.minPolarAngle   = Math.PI * 0.18;
  controls.maxPolarAngle   = Math.PI * 0.82;

  /* ================================================================
     LIGHTING  —  tuned for powder-coat matte surfaces
  ================================================================ */
  // Generous ambient so all faces are readable
  scene.add(new THREE.AmbientLight(0xffffff, 0.72));

  // Main key (warm, upper-right-front)
  const keyLight = new THREE.DirectionalLight(0xfff8f0, 1.2);
  keyLight.position.set(6, 9, 7);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.left   = keyLight.shadow.camera.bottom = -10;
  keyLight.shadow.camera.right  = keyLight.shadow.camera.top   =  10;
  keyLight.shadow.camera.near   = 0.5;
  keyLight.shadow.camera.far    = 40;
  keyLight.shadow.bias          = -0.002;
  scene.add(keyLight);

  // Cool fill from left-back (separates blocks from bg)
  const fillLight = new THREE.DirectionalLight(0xdde8f5, 0.45);
  fillLight.position.set(-6, 1, -5);
  scene.add(fillLight);

  // Soft under-light (lifts shadow faces slightly)
  const bottomLight = new THREE.DirectionalLight(0xffffff, 0.18);
  bottomLight.position.set(0, -8, 2);
  scene.add(bottomLight);

  /* ================================================================
     PROJECT DATA
  ================================================================ */
  const PROJECTS = [
    // labelFace: BoxGeometry index — +X=0  -X=1  +Y=2  -Y=3  +Z=4  -Z=5
    { id: 'megamarket',  name: 'Megamarket', url: 'projects/megamarket.html', hex: '#7A5CB8', faceW: 1.40, faceH: 2.90, labelFace: 1, vertical: true },
    { id: 'avito',       name: 'Avito',      url: 'projects/avito.html',      hex: '#E8E6E1', faceW: 2.90, faceH: 1.40, labelFace: 4 },
    { id: 'viju',        name: 'Viju',       url: 'projects/viju.html',       hex: '#58B8AF', faceW: 1.40, faceH: 1.40, labelFace: 5 },
    { id: 'viju-cms',    name: 'Viju CMS',   url: 'projects/viju-cms.html',   hex: '#243536', faceW: 1.40, faceH: 1.40, labelFace: 0 },
    { id: 'brag-house',  name: 'Brag House', url: 'projects/brag-house.html', hex: '#C23BB6', faceW: 1.40, faceH: 1.40, labelFace: 2 },
    { id: 'sbermarket',  name: 'Sbermarket', url: 'projects/sbermarket.html', hex: '#D77A1C', faceW: 1.40, faceH: 1.40, labelFace: 4 },
  ];

  /* ================================================================
     HELPERS
  ================================================================ */

  // Box geometry with 8 rounded vertex corners (radius r) but otherwise sharp.
  // Uses a subdivided BoxGeometry; each vertex is projected outward from the
  // "inner box" (shrunk by r) so corners become spherical caps while flat face
  // centres remain perfectly planar. Six material groups are preserved intact.
  function createRoundedBoxGeometry(w, h, d, r, segs) {
    const geo = new THREE.BoxGeometry(w, h, d, segs, segs, segs);
    const pos  = geo.attributes.position;
    const hw = w / 2 - r, hh = h / 2 - r, hd = d / 2 - r;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      // Nearest point on the inner box
      const cx = Math.max(-hw, Math.min(hw, x));
      const cy = Math.max(-hh, Math.min(hh, y));
      const cz = Math.max(-hd, Math.min(hd, z));
      const dx = x - cx, dy = y - cy, dz = z - cz;
      const len = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (len > 1e-6) {
        pos.setXYZ(i, cx + dx / len * r, cy + dy / len * r, cz + dz / len * r);
      }
    }
    pos.needsUpdate = true;
    geo.computeVertexNormals();
    return geo;
  }

  function brightness(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return 0.299 * r + 0.587 * g + 0.114 * b;
  }
  function hexInt(hex) { return parseInt(hex.replace('#', ''), 16); }

  /* ================================================================
     LABEL TEXTURE  —  flat powder-coat colour + centred text
     Canvas aspect ratio matches the physical face so text is undistorted.
     Font sizes are ~⅔ of the old values (÷ 1.5).
     vertical:true rotates text 90° CCW (reads bottom → top on the face).
  ================================================================ */
  function makeTexture(proj) {
    const BASE  = 512;
    const ratio = proj.faceW / proj.faceH;
    const cw = ratio >= 1 ? BASE : Math.round(BASE * ratio);
    const ch = ratio >= 1 ? Math.round(BASE / ratio) : BASE;

    const cv  = document.createElement('canvas');
    cv.width  = cw;
    cv.height = ch;
    const ctx = cv.getContext('2d');

    ctx.fillStyle = proj.hex;
    ctx.fillRect(0, 0, cw, ch);

    const bright    = brightness(proj.hex);
    const textColor = bright < 148 ? 'rgba(255,255,255,0.92)' : 'rgba(22,22,22,0.82)';
    ctx.fillStyle    = textColor;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';

    const short = Math.min(cw, ch);
    const words = proj.name.split(' ');

    if (proj.vertical) {
      // Vertical text: rotate −90° so it reads bottom→top on the face
      // Font size scaled to the shorter canvas dimension (÷ 1.5 vs old)
      const fs = Math.round(short * (proj.name.length > 7 ? 0.33 : 0.39));
      ctx.font = `700 ${fs}px -apple-system, "Helvetica Neue", Arial, sans-serif`;
      ctx.save();
      ctx.translate(cw / 2, ch / 2);
      ctx.rotate(-Math.PI / 2);
      if (words.length === 1) {
        ctx.fillText(proj.name, 0, 0);
      } else {
        ctx.fillText(words[0],                  0, -fs * 0.56);
        ctx.fillText(words.slice(1).join(' '),  0,  fs * 0.56);
      }
      ctx.restore();
    } else if (words.length === 1) {
      // Single word — reduced font (÷ 1.5)
      const fs = Math.round(short * (proj.name.length > 7 ? 0.33 : 0.39));
      ctx.font = `700 ${fs}px -apple-system, "Helvetica Neue", Arial, sans-serif`;
      ctx.fillText(proj.name, cw / 2, ch / 2);
    } else {
      // Two words stacked — reduced font (÷ 1.5)
      const fs = Math.round(short * 0.31);
      ctx.font = `700 ${fs}px -apple-system, "Helvetica Neue", Arial, sans-serif`;
      ctx.fillText(words[0],                  cw / 2, ch / 2 - fs * 0.56);
      ctx.fillText(words.slice(1).join(' '),  cw / 2, ch / 2 + fs * 0.56);
    }

    return new THREE.CanvasTexture(cv);
  }

  /* ================================================================
     BLOCKS  —  2 × 2 × 2 master cube, asymmetric subdivision
     ────────────────────────────────────────────────────────────
     C  = 1.4   (unit cell)     G   = 0.10  (gap)
     HS = 0.75  (half-step)     P   = 2.90  (prism span)

     Front (z = −HS):   Back (z = +HS):
       [ P1 ][ C2 ]       [ C3 ][ C4 ]
       [ P1 ][ C1 ]       [   P2    ]

     P1 + P2 form an L-shaped complementary pair.
  ================================================================ */
  const GROUP = new THREE.Group();
  scene.add(GROUP);

  const C  = 1.40;
  const G  = 0.10;
  const HS = (C + G) / 2;   // 0.75
  const P  = 2 * C + G;     // 2.90

  //  All rotations = 0 so neighbouring faces are perfectly parallel/flush
  const BLOCK_DEFS = [
    // P1 – tall vertical prism, left col, full height, front  ── Megamarket
    { w: C, h: P, d: C,  x: -HS, y:   0, z: -HS },
    // P2 – wide horizontal prism, bottom row, full width, back ── Avito
    { w: P, h: C, d: C,  x:   0, y: -HS, z: +HS },
    // C1 – cube, front-right-bottom                           ── Viju
    { w: C, h: C, d: C,  x: +HS, y: -HS, z: -HS },
    // C2 – cube, front-right-top                             ── Viju CMS
    { w: C, h: C, d: C,  x: +HS, y: +HS, z: -HS },
    // C3 – cube, back-left-top                               ── Brag House
    { w: C, h: C, d: C,  x: -HS, y: +HS, z: +HS },
    // C4 – cube, back-right-top                              ── Sbermarket
    { w: C, h: C, d: C,  x: +HS, y: +HS, z: +HS },
  ];

  const meshes   = [];
  const basePosY = [];

  PROJECTS.forEach((proj, i) => {
    const def = BLOCK_DEFS[i];

    // Rounded-corner box: edges stay 90°, only the 8 vertex corners get r=0.1
    const geo = createRoundedBoxGeometry(def.w, def.h, def.d, 0.1, 6);

    // Flat powder-coat colour for the 5 plain faces
    const plainMat = new THREE.MeshStandardMaterial({
      color:     hexInt(proj.hex),
      metalness: 0.00,
      roughness: 0.86,
    });

    // Label face — each block exposes its label on a different face:
    //   Megamarket → -X (index 1), vertical text
    //   Avito      → +Z (index 4)
    //   Viju       → -Z (index 5)
    //   Viju CMS   → +X (index 0)
    //   Brag House → +Y (index 2)
    //   Sbermarket → +Z (index 4)
    const labelMat = new THREE.MeshStandardMaterial({
      map:       makeTexture(proj),
      metalness: 0.00,
      roughness: 0.86,
    });

    // Build material array, placing labelMat on the correct face index
    const mats = [plainMat, plainMat, plainMat, plainMat, plainMat, plainMat];
    mats[proj.labelFace] = labelMat;

    const mesh = new THREE.Mesh(geo, mats);

    mesh.position.set(def.x, def.y, def.z);
    // No rotation — all faces perfectly axis-aligned and parallel
    mesh.castShadow    = true;
    mesh.receiveShadow = true;
    mesh.userData      = { proj, hovered: false };

    GROUP.add(mesh);
    meshes.push(mesh);
    basePosY.push(def.y);
  });

  /* ================================================================
     MOUSE / INTERACTION
  ================================================================ */
  const raycaster = new THREE.Raycaster();
  const mouseNDC  = new THREE.Vector2(-999, -999);
  let hoveredMesh  = null;
  let pointerDownX = 0, pointerDownY = 0;
  let isDragging   = false;

  document.addEventListener('mousemove', e => {
    mouseNDC.x =  (e.clientX / innerWidth)  * 2 - 1;
    mouseNDC.y = -(e.clientY / innerHeight) * 2 + 1;
    tooltip.style.left = e.clientX + 'px';
    tooltip.style.top  = e.clientY + 'px';
  });

  renderer.domElement.addEventListener('pointerdown', e => {
    pointerDownX = e.clientX;
    pointerDownY = e.clientY;
    isDragging   = false;
    controls.autoRotate = false;
    renderer.domElement.style.cursor = 'grabbing';
  });

  renderer.domElement.addEventListener('pointermove', e => {
    if (Math.abs(e.clientX - pointerDownX) > 4 || Math.abs(e.clientY - pointerDownY) > 4)
      isDragging = true;
  });

  renderer.domElement.addEventListener('pointerup', e => {
    renderer.domElement.style.cursor = hoveredMesh ? 'pointer' : 'grab';
    setTimeout(() => { controls.autoRotate = true; }, 2800);
    if (isDragging) return;

    scene.updateMatrixWorld(true);
    camera.updateMatrixWorld();
    const ndc = new THREE.Vector2(
      (e.clientX  / innerWidth)  * 2 - 1,
      -(e.clientY / innerHeight) * 2 + 1
    );
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(meshes, false);
    if (hits.length > 0) window.location.href = hits[0].object.userData.proj.url;
  });

  /* ================================================================
     RESIZE
  ================================================================ */
  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  /* ================================================================
     ANIMATION LOOP
  ================================================================ */
  const clock = new THREE.Clock();
  const _v3   = new THREE.Vector3();

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    // Gentle whole-group float
    GROUP.position.y = Math.sin(t * 0.42) * 0.07;
    GROUP.position.x = Math.sin(t * 0.28) * 0.022;

    // Hover detection
    raycaster.setFromCamera(mouseNDC, camera);
    const hits       = raycaster.intersectObjects(meshes, false);
    const newHovered = hits.length > 0 ? hits[0].object : null;

    if (newHovered !== hoveredMesh) {
      if (hoveredMesh) {
        hoveredMesh.userData.hovered  = false;
        tooltip.style.opacity         = '0';
      }
      hoveredMesh = newHovered;
      if (hoveredMesh) {
        hoveredMesh.userData.hovered        = true;
        tooltip.textContent                 = hoveredMesh.userData.proj.name;
        tooltip.style.opacity               = '1';
        renderer.domElement.style.cursor    = 'pointer';
      } else {
        renderer.domElement.style.cursor    = 'grab';
      }
    }

    // Per-block subtle breathing
    meshes.forEach((mesh, i) => {
      const floatY = Math.sin(t * 0.55 + i * 1.1) * 0.012;
      mesh.position.y = basePosY[i] + floatY;

      const tgt = mesh.userData.hovered ? 1.068 : 1.0;
      _v3.setScalar(tgt);
      mesh.scale.lerp(_v3, 0.09);
    });

    controls.update();
    renderer.render(scene, camera);
  }

  animate();
  </script>
</body>
</html>
