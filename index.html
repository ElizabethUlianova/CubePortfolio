<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #919191;
      overflow: hidden;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    canvas { display: block; }

    #tooltip {
      position: fixed;
      top: 0; left: 0;
      padding: 6px 14px;
      background: rgba(8, 8, 8, 0.70);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border-radius: 3px;
      pointer-events: none;
      opacity: 0;
      transform: translate(18px, -50%);
      transition: opacity 0.15s ease;
      white-space: nowrap;
    }

    #hint {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.35);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
    }

    #brand {
      position: fixed;
      top: 28px; left: 36px;
      color: rgba(255, 255, 255, 0.50);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      user-select: none;
    }

    #counter {
      position: fixed;
      top: 28px; right: 36px;
      color: rgba(255, 255, 255, 0.32);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      user-select: none;
    }
  </style>
</head>
<body>

  <div id="brand">Portfolio</div>
  <div id="counter">6 Projects</div>
  <div id="tooltip"></div>
  <div id="hint">Drag to rotate &nbsp;·&nbsp; Click to open</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
  /* ================================================================
     SCENE
  ================================================================ */
  const tooltip = document.getElementById('tooltip');

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x919191);

  const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
  camera.position.set(0, 0.2, 7.2);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
  renderer.outputEncoding    = THREE.sRGBEncoding;
  renderer.toneMapping       = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  document.body.appendChild(renderer.domElement);

  /* ================================================================
     CONTROLS
  ================================================================ */
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping   = true;
  controls.dampingFactor   = 0.055;
  controls.enableZoom      = false;
  controls.enablePan       = false;
  controls.rotateSpeed     = 0.65;
  controls.autoRotate      = true;
  controls.autoRotateSpeed = 0.38;
  controls.minPolarAngle   = Math.PI * 0.18;
  controls.maxPolarAngle   = Math.PI * 0.82;

  /* ================================================================
     LIGHTING  —  tuned for powder-coat matte surfaces
  ================================================================ */
  // Generous ambient so all faces are readable
  scene.add(new THREE.AmbientLight(0xffffff, 0.72));

  // Main key (warm, upper-right-front)
  const keyLight = new THREE.DirectionalLight(0xfff8f0, 1.2);
  keyLight.position.set(6, 9, 7);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.left   = keyLight.shadow.camera.bottom = -10;
  keyLight.shadow.camera.right  = keyLight.shadow.camera.top   =  10;
  keyLight.shadow.camera.near   = 0.5;
  keyLight.shadow.camera.far    = 40;
  keyLight.shadow.bias          = -0.002;
  scene.add(keyLight);

  // Cool fill from left-back (separates blocks from bg)
  const fillLight = new THREE.DirectionalLight(0xdde8f5, 0.45);
  fillLight.position.set(-6, 1, -5);
  scene.add(fillLight);

  // Soft under-light (lifts shadow faces slightly)
  const bottomLight = new THREE.DirectionalLight(0xffffff, 0.18);
  bottomLight.position.set(0, -8, 2);
  scene.add(bottomLight);

  /* ================================================================
     PROJECT DATA
  ================================================================ */
  const PROJECTS = [
    { id: 'megamarket',  name: 'Megamarket', url: 'projects/megamarket.html', hex: '#7A5CB8' },
    { id: 'avito',       name: 'Avito',      url: 'projects/avito.html',      hex: '#E8E6E1' },
    { id: 'viju',        name: 'Viju',       url: 'projects/viju.html',       hex: '#58B8AF' },
    { id: 'viju-cms',    name: 'Viju CMS',   url: 'projects/viju-cms.html',   hex: '#243536' },
    { id: 'brag-house',  name: 'Brag House', url: 'projects/brag-house.html', hex: '#C23BB6' },
    { id: 'sbermarket',  name: 'Sbermarket', url: 'projects/sbermarket.html', hex: '#D77A1C' },
  ];

  /* ================================================================
     HELPERS
  ================================================================ */
  // Perceived brightness  (0–255)
  function brightness(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return 0.299 * r + 0.587 * g + 0.114 * b;
  }

  // Hex string → Three.js integer colour
  function hexInt(hex) { return parseInt(hex.replace('#', ''), 16); }

  /* ================================================================
     POWDER-COAT CANVAS TEXTURE
     Flat base colour + micro-grain noise + centred label
  ================================================================ */
  function makeTexture(proj) {
    const SZ  = 512;
    const cv  = document.createElement('canvas');
    cv.width  = cv.height = SZ;
    const ctx = cv.getContext('2d');

    // ── 1. Flat base colour ──────────────────────────────────────
    ctx.fillStyle = proj.hex;
    ctx.fillRect(0, 0, SZ, SZ);

    // ── 2. Powder-coat micro-grain (pixel-level noise) ───────────
    const imgData = ctx.getImageData(0, 0, SZ, SZ);
    const d       = imgData.data;
    // Seeded pseudo-random for consistency across redraws
    let seed = 42;
    const rand = () => { seed = (seed * 1664525 + 1013904223) & 0xffffffff; return (seed >>> 0) / 0xffffffff; };
    for (let i = 0; i < d.length; i += 4) {
      const n = (rand() - 0.5) * 22;
      d[i]     = Math.max(0, Math.min(255, d[i]     + n));
      d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n));
      d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n));
    }
    ctx.putImageData(imgData, 0, 0);

    // ── 3. Soft inner-shadow vignette (edge depth) ───────────────
    const vig = ctx.createRadialGradient(SZ/2, SZ/2, SZ * 0.22, SZ/2, SZ/2, SZ * 0.72);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.20)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, SZ, SZ);

    // ── 4. Label ─────────────────────────────────────────────────
    const bright    = brightness(proj.hex);
    const textColor = bright < 148
      ? 'rgba(255,255,255,0.88)'
      : 'rgba(28,28,28,0.78)';

    ctx.fillStyle    = textColor;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';

    const words = proj.name.split(' ');
    if (words.length === 1) {
      const fs = proj.name.length > 8 ? 50 : 60;
      ctx.font = `600 ${fs}px -apple-system, "Helvetica Neue", Arial, sans-serif`;
      ctx.fillText(proj.name, SZ / 2, SZ / 2);
    } else {
      ctx.font = `600 52px -apple-system, "Helvetica Neue", Arial, sans-serif`;
      ctx.fillText(words[0],              SZ / 2, SZ / 2 - 36);
      ctx.fillText(words.slice(1).join(' '), SZ / 2, SZ / 2 + 36);
    }

    return new THREE.CanvasTexture(cv);
  }

  /* ================================================================
     ROUNDED BOX GEOMETRY
     Uses ExtrudeGeometry with a rounded-rect Shape + bevel.
     All 12 edges and all 8 corners become smooth.
  ================================================================ */
  function makeRoundedBoxGeo(width, height, depth, radius, segs) {
    radius = Math.min(radius, width / 2 - 0.002, height / 2 - 0.002, depth / 2 - 0.002);
    const x = -width  / 2;
    const y = -height / 2;
    const r = radius;

    const shape = new THREE.Shape();
    shape.moveTo(x, y + r);
    shape.lineTo(x, y + height - r);
    shape.quadraticCurveTo(x,             y + height, x + r,         y + height);
    shape.lineTo(x + width - r,           y + height);
    shape.quadraticCurveTo(x + width,     y + height, x + width,     y + height - r);
    shape.lineTo(x + width,               y + r);
    shape.quadraticCurveTo(x + width,     y,           x + width - r, y);
    shape.lineTo(x + r,                   y);
    shape.quadraticCurveTo(x,             y,           x,             y + r);

    const extrudeDepth = Math.max(0.001, depth - 2 * radius);
    const geo = new THREE.ExtrudeGeometry(shape, {
      depth:          extrudeDepth,
      bevelEnabled:   true,
      bevelThickness: radius,
      bevelSize:      radius * 0.92,
      bevelSegments:  segs,
      curveSegments:  segs,
    });
    geo.center();
    geo.computeVertexNormals();
    return geo;
  }

  /* ================================================================
     BLOCKS  —  2 × 2 × 2 master cube, asymmetric subdivision
     ────────────────────────────────────────────────────────────
     C  = 1.4   (unit cell)     G   = 0.10  (gap)
     HS = 0.75  (half-step)     P   = 2.90  (prism span)

     Front (z = −HS):   Back (z = +HS):
       [ P1 ][ C2 ]       [ C3 ][ C4 ]
       [ P1 ][ C1 ]       [   P2    ]

     P1 + P2 form an L-shaped complementary pair.
  ================================================================ */
  const GROUP = new THREE.Group();
  scene.add(GROUP);

  const C  = 1.40;
  const G  = 0.10;
  const HS = (C + G) / 2;   // 0.75
  const P  = 2 * C + G;     // 2.90

  const RAD  = 0.13;   // corner/edge radius
  const SEGS = 3;      // bevel + curve segments

  const BLOCK_DEFS = [
    // P1 – tall vertical prism, left col, full height, front  ── Megamarket
    { w: C, h: P, d: C,  x: -HS, y:   0, z: -HS,  rx:  0.018, ry:  0.026, rz:  0.010 },
    // P2 – wide horizontal prism, bottom row, full width, back ── Avito
    { w: P, h: C, d: C,  x:   0, y: -HS, z: +HS,  rx: -0.014, ry:  0.030, rz: -0.008 },
    // C1 – cube, front-right-bottom                           ── Viju
    { w: C, h: C, d: C,  x: +HS, y: -HS, z: -HS,  rx:  0.022, ry: -0.018, rz:  0.015 },
    // C2 – cube, front-right-top                             ── Viju CMS
    { w: C, h: C, d: C,  x: +HS, y: +HS, z: -HS,  rx: -0.013, ry:  0.021, rz:  0.011 },
    // C3 – cube, back-left-top                               ── Brag House
    { w: C, h: C, d: C,  x: -HS, y: +HS, z: +HS,  rx:  0.018, ry: -0.024, rz: -0.013 },
    // C4 – cube, back-right-top                              ── Sbermarket
    { w: C, h: C, d: C,  x: +HS, y: +HS, z: +HS,  rx: -0.011, ry:  0.017, rz:  0.020 },
  ];

  const meshes   = [];
  const basePosY = [];

  PROJECTS.forEach((proj, i) => {
    const def = BLOCK_DEFS[i];
    const geo = makeRoundedBoxGeo(def.w, def.h, def.d, RAD, SEGS);
    const tex = makeTexture(proj);

    // ── Powder-coat material: zero metal, high roughness ──────
    const mat = new THREE.MeshStandardMaterial({
      map:       tex,
      color:     0xffffff,
      metalness: 0.00,
      roughness: 0.86,
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(def.x, def.y, def.z);
    mesh.rotation.set(def.rx, def.ry, def.rz);
    mesh.castShadow    = true;
    mesh.receiveShadow = true;
    mesh.userData      = { proj, hovered: false };

    GROUP.add(mesh);
    meshes.push(mesh);
    basePosY.push(def.y);
  });

  /* ================================================================
     MOUSE / INTERACTION
  ================================================================ */
  const raycaster = new THREE.Raycaster();
  const mouseNDC  = new THREE.Vector2(-999, -999);
  let hoveredMesh  = null;
  let pointerDownX = 0, pointerDownY = 0;
  let isDragging   = false;

  document.addEventListener('mousemove', e => {
    mouseNDC.x =  (e.clientX / innerWidth)  * 2 - 1;
    mouseNDC.y = -(e.clientY / innerHeight) * 2 + 1;
    tooltip.style.left = e.clientX + 'px';
    tooltip.style.top  = e.clientY + 'px';
  });

  renderer.domElement.addEventListener('pointerdown', e => {
    pointerDownX = e.clientX;
    pointerDownY = e.clientY;
    isDragging   = false;
    controls.autoRotate = false;
    renderer.domElement.style.cursor = 'grabbing';
  });

  renderer.domElement.addEventListener('pointermove', e => {
    if (Math.abs(e.clientX - pointerDownX) > 4 || Math.abs(e.clientY - pointerDownY) > 4)
      isDragging = true;
  });

  renderer.domElement.addEventListener('pointerup', e => {
    renderer.domElement.style.cursor = hoveredMesh ? 'pointer' : 'grab';
    setTimeout(() => { controls.autoRotate = true; }, 2800);
    if (isDragging) return;

    scene.updateMatrixWorld(true);
    camera.updateMatrixWorld();
    const ndc = new THREE.Vector2(
      (e.clientX  / innerWidth)  * 2 - 1,
      -(e.clientY / innerHeight) * 2 + 1
    );
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(meshes, false);
    if (hits.length > 0) window.location.href = hits[0].object.userData.proj.url;
  });

  /* ================================================================
     RESIZE
  ================================================================ */
  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  /* ================================================================
     ANIMATION LOOP
  ================================================================ */
  const clock = new THREE.Clock();
  const _v3   = new THREE.Vector3();

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    // Gentle whole-group float
    GROUP.position.y = Math.sin(t * 0.42) * 0.07;
    GROUP.position.x = Math.sin(t * 0.28) * 0.022;

    // Hover detection
    raycaster.setFromCamera(mouseNDC, camera);
    const hits       = raycaster.intersectObjects(meshes, false);
    const newHovered = hits.length > 0 ? hits[0].object : null;

    if (newHovered !== hoveredMesh) {
      if (hoveredMesh) {
        hoveredMesh.userData.hovered  = false;
        tooltip.style.opacity         = '0';
      }
      hoveredMesh = newHovered;
      if (hoveredMesh) {
        hoveredMesh.userData.hovered        = true;
        tooltip.textContent                 = hoveredMesh.userData.proj.name;
        tooltip.style.opacity               = '1';
        renderer.domElement.style.cursor    = 'pointer';
      } else {
        renderer.domElement.style.cursor    = 'grab';
      }
    }

    // Per-block subtle breathing
    meshes.forEach((mesh, i) => {
      const floatY = Math.sin(t * 0.55 + i * 1.1) * 0.012;
      mesh.position.y = basePosY[i] + floatY;

      const tgt = mesh.userData.hovered ? 1.068 : 1.0;
      _v3.setScalar(tgt);
      mesh.scale.lerp(_v3, 0.09);
    });

    controls.update();
    renderer.render(scene, camera);
  }

  animate();
  </script>
</body>
</html>
